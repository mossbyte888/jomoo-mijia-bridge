  "conditions": [
    {
      "condition": "template",
      "value_template": "{{ trigger.from_state is not none and trigger.from_state.state not in ['unknown', 'unavailable'] and trigger.to_state is not none and trigger.to_state.state != trigger.from_state.state and event_name in routes and as_datetime(trigger.to_state.state, none) is not none and 0 <= (as_timestamp(now()) - as_timestamp(trigger.to_state.state, 0)) < 30 }}"
    }
  ],
  "actions": [
    {
      "choose": [
        {
          "conditions": "{{ route.action == 'select.select_option' }}",
          "sequence": [
            {
              "action": "select.select_option",
              "target": {
                "entity_id": "{{ route.entity }}"
              },
              "data": {
                "option": "{{ route.option }}"
              }
            }
          ]
        }
      ],
      "default": [
        {
          "action": "{{ route.action }}",
          "target": {
            "entity_id": "{{ route.entity }}"
          }
        }
      ]
    }
  ],
  "mode": "parallel",
  "max": 20,
  "max_exceeded": "warning"
}
